name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RBM_NO_DEBUG: 1

jobs:
  build-tor:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y uidmap zstd jq zip build-essential \
            libyaml-libyaml-perl libtemplate-perl libcapture-tiny-perl \
            libjson-perl libpath-tiny-perl libfile-slurp-perl \
            libfile-copy-recursive-perl libstring-shellquote-perl \
            libsort-versions-perl libdata-uuid-perl libdata-dump-perl \
            libdatetime-perl libxml-writer-perl libparallel-forkmanager-perl

      - name: Configure user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          echo "runner:100000:65536" | sudo tee /etc/subuid
          echo "runner:100000:65536" | sudo tee /etc/subgid

      - name: Build tor project
        run: |
          ./rbm/rbm build tor --target no_containers --target nightly --target linux-x86_64 --target linux
