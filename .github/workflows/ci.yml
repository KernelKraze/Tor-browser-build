name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-tor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tor source
        uses: actions/checkout@v4
        with:
          repository: KernelKraze/The-Onion-Router
          ref: ci/github-actions
          path: tor

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential pkg-config libssl-dev libevent-dev \
            zlib1g-dev liblzma-dev libzstd-dev libcap-dev \
            automake libtool

      - name: Build tor
        run: |
          cd tor
          autoreconf -fi
          ./configure --enable-fatal-warnings --disable-asciidoc
          make -j$(nproc)
