name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast smoke build of our tor. The hours-long full browser build
  # (build-tor-browser + its nightly schedule) was removed: the browser is now
  # produced by the repackage-browser workflow (official browser + our tor.exe),
  # and the tor binaries come from The-Onion-Router releases.
  build-tor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tor source
        uses: actions/checkout@v4
        with:
          repository: KernelKraze/The-Onion-Router
          ref: ci/github-actions
          path: tor
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential pkg-config libssl-dev libevent-dev \
            zlib1g-dev liblzma-dev libzstd-dev libcap-dev \
            automake libtool

      - name: Build tor
        run: |
          cd tor
          autoreconf -fi
          ./configure --enable-fatal-warnings --disable-asciidoc
          make -j"$(nproc)"
