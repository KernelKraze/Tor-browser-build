name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-tor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tor source
        uses: actions/checkout@v4
        with:
          repository: KernelKraze/The-Onion-Router
          ref: ci/github-actions
          path: tor
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential pkg-config libssl-dev libevent-dev \
            zlib1g-dev liblzma-dev libzstd-dev libcap-dev \
            automake libtool

      - name: Build tor
        run: |
          cd tor
          autoreconf -fi
          ./configure --enable-fatal-warnings --disable-asciidoc
          make -j$(nproc)

  build-tor-browser-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 540
    permissions:
      contents: write
    steps:
      - name: Checkout tor-browser-build
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Enable user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "kernel.apparmor_restrict_unprivileged_userns=0" | \
            sudo tee /etc/sysctl.d/99-userns.conf > /dev/null

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            git uidmap zstd jq zip \
            libdata-dump-perl libdata-uuid-perl libdatetime-perl \
            libdigest-sha-perl libfile-copy-recursive-perl \
            libfile-slurp-perl libio-all-perl libcapture-tiny-perl \
            libio-handle-util-perl libjson-perl \
            libparallel-forkmanager-perl libpath-tiny-perl \
            libsort-versions-perl libstring-shellquote-perl \
            libtemplate-perl libxml-libxml-perl libxml-writer-perl \
            libyaml-libyaml-perl

      - name: Generate nightly version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE=$(date -u +%Y.%m.%d)
          VERSION="tbb-nightly.${DATE}"
          TAG="nightly-${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${VERSION}, tag: ${TAG}"

      - name: Verify Tor source before build
        run: |
          echo "=== Tor source verification ==="
          echo "Tor Browser Build repo commit: ${GITHUB_SHA}"
          echo "Tor source (nightly target): https://github.com/KernelKraze/The-Onion-Router.git @ ci/github-actions"
          echo ""
          echo "=== rbm.conf tor project config ==="
          grep -A5 'nightly:' projects/tor/config
          echo ""
          echo "=== Browser input_files (tor-expert-bundle) ==="
          grep -A2 'tor-expert-bundle' projects/browser/config

      - name: Build Tor Browser Windows x86_64 (nightly)
        env:
          RBM_NO_DEBUG: "1"
        run: |
          ./rbm/rbm build release \
            --target nightly \
            --target browser-single-platform \
            --target browser-windows-x86_64 \
            --target torbrowser

      - name: Collect build metadata
        id: meta
        if: always()
        run: |
          META_DIR="torbrowser/nightly-build-info"
          mkdir -p "$META_DIR"

          {
            echo "=== Build Metadata ==="
            echo "Build timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GitHub commit: ${GITHUB_SHA}"
            echo "GitHub ref: ${GITHUB_REF}"
            echo "Nightly version: ${{ steps.version.outputs.version }}"
            echo ""
            echo "=== Tor Source ==="
            echo "Repository: https://github.com/KernelKraze/The-Onion-Router.git"
            echo "Branch: ci/github-actions"
            echo ""
            echo "=== Tor Browser Build Config ==="
            echo "Tor version in rbm.conf:"
            grep 'torbrowser_version:' rbm.conf | head -1
            echo ""
            echo "Tor project nightly config:"
            sed -n '/^  nightly:/,/^[^ ]/p' projects/tor/config
          } > "${META_DIR}/build-info.txt"

          echo "build_info_dir=${META_DIR}" >> "$GITHUB_OUTPUT"
          cat "${META_DIR}/build-info.txt"

      - name: Upload to Actions Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-browser-windows-x86_64-nightly
          path: |
            torbrowser/nightly/**/*.exe
            torbrowser/nightly/**/*.sha256sums
            torbrowser/nightly-build-info/build-info.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Create GitHub Pre-release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          RELEASE_DIR=$(find torbrowser/nightly -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -z "$RELEASE_DIR" ]; then
            echo "::error::No nightly release directory found under torbrowser/nightly/"
            exit 1
          fi

          EXE_FILE=$(find "$RELEASE_DIR" -name '*.exe' | head -1)
          SHA_FILE=$(find "$RELEASE_DIR" -name '*.sha256sums' | head -1)

          if [ -z "$EXE_FILE" ]; then
            echo "::error::No .exe installer found in ${RELEASE_DIR}"
            exit 1
          fi

          BUILD_INFO="${{ steps.meta.outputs.build_info_dir }}/build-info.txt"

          {
          echo "## Tor Browser Nightly — Windows x86_64"
          echo ""
          echo "**Version:** ${VERSION}"
          echo "**Platform:** Windows x86_64"
          echo "**Channel:** Nightly"
          echo "**Tor source:** KernelKraze/The-Onion-Router @ ci/github-actions"
          echo "**CI commit:** ${GITHUB_SHA::7}"
          echo ""
          echo "> Files are unsigned — do not use in production."
          } > /tmp/release-notes.txt

          ASSETS=""
          ASSETS="${EXE_FILE}"
          if [ -n "$SHA_FILE" ]; then
            ASSETS="${ASSETS} ${SHA_FILE}"
          fi
          if [ -f "$BUILD_INFO" ]; then
            ASSETS="${ASSETS} ${BUILD_INFO}"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tor Browser Nightly ${VERSION} — Windows x86_64" \
            --notes-file /tmp/release-notes.txt \
            --prerelease \
            $ASSETS

          echo "Pre-release created: ${TAG}"

